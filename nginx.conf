# Canonicalise www. onto the apex. Traefik terminates TLS and forwards the
# original Host, so nginx sees www.testnummers.dev here. Matching on a capture
# rather than the literal domain keeps this config domain-agnostic.
server {
    listen 80;
    listen [::]:80;

    server_name ~^www\.(?<apex>.+)$;

    return 301 https://$apex$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine has gzip but no brotli.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # add_header in a nested block discards everything inherited from here, so
    # the security headers are repeated in every location that sets its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Vite content-hashes everything under dist/assets/, so a filename only ever
    # names one build's worth of bytes — immutable caching is safe here.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # The entrypoint is unhashed, so a deploy has to be picked up right away.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # Not every nginx mime.types maps .webmanifest; the empty types block plus
    # default_type pins it without clobbering the inherited mapping.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # No vue-router here — a single mounted App.vue with no client-side routes —
    # so an index.html fallback would only turn typos into soft 404s. Switch to
    # `try_files $uri $uri/ /index.html;` if a router is ever added.
    location / {
        try_files $uri $uri/ =404;
    }
}
